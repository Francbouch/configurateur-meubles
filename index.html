<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f3f1ec">
  <title>Configurateur de meubles</title>
  <link rel="stylesheet" href="./styles.css?v=closed5-clean-1">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#">FB <span>Mobilier</span></a>
    <span class="prototype">Configurateur 3D</span>
  </header>

  <main class="app">
    <section class="viewer-card">
      <div id="viewer">
        <div id="loading" class="loading"><span></span><p>Chargement du meuble…</p></div>
        <div id="empty" class="empty hidden"><strong>Impossible de charger le configurateur</strong><p>Rechargez la page.</p></div>
      </div>
      <div class="viewer-tools">
        <button id="resetView" type="button">Vue initiale</button>
        <span>Glisser pour tourner · Molette pour zoomer</span>
      </div>
    </section>

    <aside class="panel">
      <p class="eyebrow">Collection</p>
      <h1>Lit cabinet François</h1>
      <p class="intro">Choisissez une partie du meuble, puis son matériau.</p>
      <div id="materialControls" class="controls"></div>
    </aside>
  </main>

  <script type="module" src="./app.js?v=closed5-material-preview-2"></script>
</body>
</html>
